name: Nova
options:
  bundleIdPrefix: com.akarukasu
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    from: "0.4.8"

targets:
  Nova:
    type: application
    platform: iOS
    sources:
      - path: Nova
    dependencies:
      - package: YouTubeKit
    scheme: {}
    info:
      path: Nova/Info.plist
      properties:
        CFBundleDisplayName: Nova
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "3"
        LSApplicationCategoryType: public.app-category.music
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSAppleMusicUsageDescription: Nova lit tes playlists Apple Music pour les importer.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akarukasu.nova
        PRODUCT_NAME: Nova
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        ENABLE_PREVIEWS: YES
