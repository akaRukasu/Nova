name: Nova
options:
  bundleIdPrefix: com.akarukasu
  developmentLanguage: fr
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    from: "0.4.8"

targets:
  Nova:
    type: application
    platform: iOS
    sources:
      - path: Nova
        excludes: [Resources/nova-octave.js]
      - path: Nova/Resources/nova-octave.js
        buildPhase: resources
    dependencies:
      - package: YouTubeKit
    scheme: {}
    info:
      path: Nova/Info.plist
      properties:
        CFBundleDisplayName: Nova
        # App en français : les boutons fournis par iOS (« Modifier », « OK »…) aussi.
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        CFBundleAllowMixedLocalizations: true
        CFBundleShortVersionString: "0.4.1"
        CFBundleVersion: "5"
        LSApplicationCategoryType: public.app-category.music
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSAppleMusicUsageDescription: Nova lit tes playlists Apple Music pour les importer.
        NSLocationWhenInUseUsageDescription: Nova utilise ta position pour trouver les concerts près de chez toi.
        NSLocalNetworkUsageDescription: Nova trouve les Jams de tes amis à proximité pour écouter ensemble.
        NSBonjourServices: [_nova-jam._tcp, _nova-jam._udp, _nova-sync._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.akarukasu.nova.jam
            CFBundleURLSchemes: [nova]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akarukasu.nova
        PRODUCT_NAME: Nova
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        ENABLE_PREVIEWS: YES
