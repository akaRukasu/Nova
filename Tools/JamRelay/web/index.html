<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141217">
  <title>Jam Nova</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="bar">
    <a href="./" class="brand"><img src="icon-192.png" alt="" width="34" height="34"> Jam Nova</a>
    <button id="leave" class="quiet" type="button" hidden>Quitter le Jam</button>
  </header>
  <main>
    <section class="landing" id="landing">
      <div>
        <h1 id="welcome">Rejoindre un Jam</h1>
        <p>Choisis le prochain morceau avec tes amis.</p>
      </div>
      <form id="invitation" class="stack" hidden>
        <label for="link">Lien d’invitation</label>
        <input id="link" type="url" required placeholder="Colle le lien envoyé par l’hôte">
        <button>Ouvrir l’invitation</button>
      </form>
      <div id="choices" class="stack" hidden>
        <a class="button primary" id="native">Ouvrir dans Nova</a>
        <button class="quiet" type="button" id="browser">Continuer dans le navigateur</button>
      </div>
      <form id="join" class="stack" hidden>
        <label for="name">Ton prénom ou pseudo</label>
        <input id="name" autocomplete="nickname" maxlength="40" placeholder="Ami Nova">
        <button class="primary">Rejoindre la session</button>
      </form>
    </section>
    <div id="room" hidden>
      <div class="room-title">
        <div><h1 id="room-name">Jam</h1><p id="members"></p></div>
        <span class="connection" id="connection">Connecté</span>
      </div>
      <div class="columns">
        <section class="panel player" aria-label="Lecteur de l’hôte">
          <div class="cover"><img id="artwork" alt="" hidden></div>
          <p class="label">Sur le lecteur de l’hôte</p>
          <h2 id="playing-title">La file est vide</h2>
          <p id="playing-artist">Ajoute un titre pour lancer la musique.</p>
          <div id="transport" class="transport" hidden>
            <button class="quiet" data-command="previous" type="button">Précédent</button>
            <button class="primary" id="toggle" data-command="play" type="button">Lire</button>
            <button class="quiet" data-command="next" type="button">Suivant</button>
          </div>
        </section>
        <section class="panel tracks" aria-labelledby="add-title">
          <h2 id="add-title">Ajouter un morceau</h2>
          <form id="search" class="search">
            <input id="query" type="search" aria-label="Titre ou artiste" placeholder="Titre ou artiste sur Octave" required minlength="2" maxlength="100">
            <button class="primary">Chercher</button>
          </form>
          <p id="result-status" class="muted" role="status" hidden></p>
          <ul id="results" class="track-list" hidden></ul>
          <h2 class="next-title">À suivre</h2>
          <p id="queue-empty" class="muted">La file d’attente est vide.</p>
          <ol id="queue" class="track-list"></ol>
        </section>
      </div>
    </div>
    <p id="status" class="message" role="status" hidden></p>
  </main>
</body>
</html>
