name: Build IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Nova.xcodeproj \
            -scheme Nova \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || status=$?
          grep -E "error:|warning: unable|\*\* BUILD" build.log || true
          if [ "${status:-0}" -ne 0 ]; then
            echo "::error::La compilation a échoué (code $status)"
            exit 1
          fi
          test -x build/Build/Products/Release-iphoneos/Nova.app/Nova

      - name: Package the IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Nova.app Payload/
          zip -qry Nova.ipa Payload
          ls -lh Nova.ipa

      - name: Package the CarPlay IPA
        run: |
          # Même app, signée localement avec l'autorisation CarPlay audio (Nova/Nova.entitlements).
          # Elle ne sert qu'avec un certificat dont le profil contient cette autorisation (accordée par Apple).
          rm -rf CarPlay && mkdir -p CarPlay/Payload
          cp -R build/Build/Products/Release-iphoneos/Nova.app CarPlay/Payload/
          codesign --force --sign - --entitlements Nova/Nova.entitlements --timestamp=none CarPlay/Payload/Nova.app
          codesign -d --entitlements - CarPlay/Payload/Nova.app
          (cd CarPlay && zip -qry ../Nova-CarPlay.ipa Payload)
          ls -lh Nova-CarPlay.ipa

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nova-ipa
          path: Nova.ipa

      - name: Publish the IPA as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # main → release « latest » ; autre branche → pré-version « preview-<branche> ».
          # L'IPA est publiée telle quelle (pas de zip) : téléchargement direct depuis l'iPhone.
          BRANCH="${GITHUB_REF_NAME//\//-}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TAG="latest"
          else
            TAG="preview-$BRANCH"
          fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" Nova.ipa Nova-CarPlay.ipa \
            --target "$GITHUB_SHA" \
            --title "Nova — $GITHUB_REF_NAME — build ${{ github.run_number }}" \
            --notes "Commit $GITHUB_SHA. Nova.ipa : à installer avec Sideloadly ou SideStore. Nova-CarPlay.ipa : même app avec l'autorisation CarPlay audio, utile seulement avec un certificat qui l'inclut." \
            --prerelease
