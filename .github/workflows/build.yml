name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Nova.xcodeproj \
            -scheme Nova \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unable|\*\* BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Nova.app

      - name: Package the IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Nova.app Payload/
          zip -qry Nova.ipa Payload
          ls -lh Nova.ipa

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nova-ipa
          path: Nova.ipa

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Nova.ipa \
            --title "Nova — build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}. IPA non signée : installe-la avec Sideloadly ou SideStore." \
            --prerelease
