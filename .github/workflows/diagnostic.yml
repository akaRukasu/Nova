name: Diagnostic YouTube Music

on:
  push:
    paths:
      - "Nova/Models/**"
      - "Nova/Services/**"
      - "Tools/Diagnostic/**"
      - ".github/workflows/diagnostic.yml"
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compiler le diagnostic
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          mkdir -p diag
          xcrun --sdk macosx swiftc -O \
            Nova/Models/*.swift \
            Nova/Services/InnerTubeParser.swift \
            Nova/Services/InnerTubeClient.swift \
            Nova/Services/Account.swift \
            Nova/Services/ImportSources.swift \
            Nova/Services/PlaybackSettings.swift \
            Nova/Services/DiscoverySources.swift \
            Tools/Diagnostic/main.swift \
            -o diag/nova-diagnostic

      - name: Interroger YouTube Music
        env:
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
        run: ./diag/nova-diagnostic
