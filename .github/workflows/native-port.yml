name: Voxcord Native

on:
  push:
    branches: [codex/native-port-yapfast, voxcord/native-device-suite]
    paths: ["native-port/**", ".github/workflows/native-port.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      XWIN_SDK_VERSION: "10.0.22621"
      XWIN_ARCH: x86_64
    steps:
      - uses: actions/checkout@v5
        with:
          path: nova
      - uses: actions/checkout@v5
        with:
          repository: yapfast/yapfast
          ref: 28174c7227e9b5a7a7dd222378086e88a62cbdb1
          path: engine
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: |
            ~/.cache/cargo-xwin
            engine/.local/windows/skia-static-production/build.json
            engine/.local/windows/skia-static-production/prepared
          key: native-skia-22621-${{ hashFiles('engine/nix/flake.lock', 'engine/nix/prepare-windows-skia.py', 'engine/nix/prepare-skia-native.py', 'engine/nix/skia-windows-builder/**') }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          cache-on-failure: true
          key: voxcord-win22621
      - name: Apply Voxcord source changes
        working-directory: engine
        run: |
          git apply --check ../nova/native-port/yapfast.patch
          git apply ../nova/native-port/yapfast.patch
      - name: Prepare the Windows SDK and native renderer
        working-directory: engine
        run: |
          rustup target add x86_64-pc-windows-msvc
          nix develop path:./nix#windows --command bash -c 'set -e; cargo xwin env > /dev/null; python3 nix/prepare-windows-skia.py > /dev/null'
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/cargo-xwin
            engine/.local/windows/skia-static-production/build.json
            engine/.local/windows/skia-static-production/prepared
          key: native-skia-22621-${{ hashFiles('engine/nix/flake.lock', 'engine/nix/prepare-windows-skia.py', 'engine/nix/prepare-skia-native.py', 'engine/nix/skia-windows-builder/**') }}
      - name: Build the native Windows client
        working-directory: engine
        env:
          NOVACORD_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: nix develop path:./nix#windows --command scripts/build-windows discord --no-installer
      - uses: actions/upload-artifact@v4
        with:
          name: Voxcord-portable-and-source
          path: engine/target/dist/discord/Voxcord-*.zip
          compression-level: 0
          if-no-files-found: error
      - name: Compile the Windows media regression tests
        working-directory: engine
        run: nix develop path:./nix#windows --command bash ../nova/native-port/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Voxcord-media-tests
          path: engine/target/native-tests/*
          if-no-files-found: error

  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: Voxcord-portable-and-source
          path: package
      - uses: actions/download-artifact@v4
        with:
          name: Voxcord-media-tests
          path: media-tests
      - name: Run native camera and screen regression tests
        shell: pwsh
        run: |
          & ./media-tests/yapfast_discord.exe call_video::tests --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Camera regressions failed" }
          & ./media-tests/yapfast_discord.exe rtp::tests --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "RTP regressions failed" }
          & ./media-tests/yapfast_core.exe stream_worker::tests::screen_ --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Screen regressions failed" }
          & ./media-tests/yapfast_core.exe stream_worker::tests::fits_frames_with_even_sizes --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Screen scaling regression failed" }
          & ./media-tests/yapfast_core.exe stream_worker::tests::aims_for_discords_bitrates --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Screen bandwidth regression failed" }
          & ./media-tests/yapfast_core.exe voxcord_ --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Voxcord device or soundboard regression failed" }
      - name: Package the installer and test the installed binary
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem package -Filter "*-windows-x64.zip")
          if ($zip.Count -ne 1) { throw "Expected one Windows portable archive" }
          Expand-Archive $zip[0].FullName unpacked
          $binary = @(Get-ChildItem unpacked -Recurse -Filter voxcord.exe)
          if ($binary.Count -ne 1) { throw "Expected one native executable" }
          Copy-Item media-tests/voxcord.ico $binary[0].DirectoryName
          $inno = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          & $inno "/DSourceDir=$($binary[0].DirectoryName)" "/O$PWD" native-port/setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $target = Join-Path $env:RUNNER_TEMP "Voxcord"
          $setup = Start-Process ./Voxcord-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`"" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup failed: $($setup.ExitCode)" }
          $version = (Get-Item (Join-Path $target "voxcord.exe")).VersionInfo
          $expectedVersion = (Select-String '^AppVersion=(.+)$' native-port/setup.iss).Matches[0].Groups[1].Value
          $binaryVersion = "$($version.FileMajorPart).$($version.FileMinorPart).$($version.FileBuildPart)"
          if ($version.ProductName -ne "Voxcord" -or $binaryVersion -ne $expectedVersion) { throw "Wrong Voxcord product metadata" }
          $test = Start-Process (Join-Path $target "voxcord.exe") -ArgumentList "--smoke-test" -PassThru
          if (!$test.WaitForExit(30000)) { Stop-Process -Id $test.Id; throw "Native smoke test timed out" }
          if ($test.ExitCode -ne 0) { throw "Native smoke test failed: $($test.ExitCode)" }
          $data = Join-Path $env:RUNNER_TEMP "voxcord-native-smoke"
          $window = Start-Process (Join-Path $target "voxcord.exe") -ArgumentList "--data-dir `"$data`"" -PassThru
          try {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              $window.Refresh()
              if ($window.HasExited) { throw "Client closed: $($window.ExitCode)" }
              if ($window.MainWindowHandle -ne 0) { break }
            }
            if ($window.MainWindowHandle -eq 0) { throw "Native client did not open a window" }
            if ($window.MainWindowTitle -notmatch "Voxcord") { throw "Wrong native window title: $($window.MainWindowTitle)" }
            try {
              Add-Type -AssemblyName System.Drawing
              Add-Type -AssemblyName System.Windows.Forms
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $image = [System.Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
              $graphics = [System.Drawing.Graphics]::FromImage($image)
              try {
                $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
                $image.Save((Join-Path $PWD "Voxcord-native-startup.png"))
              } finally { $graphics.Dispose(); $image.Dispose() }
            } catch { Write-Warning "Startup screenshot unavailable: $_" }
          } finally {
            if (!$window.HasExited) { Stop-Process -Id $window.Id }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Voxcord-Windows-Setup
          path: |
            Voxcord-Setup.exe
            Voxcord-native-startup.png
          if-no-files-found: error
