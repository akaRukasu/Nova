name: NovaCord Native Preview

on:
  push:
    branches: [codex/native-preview]
    paths: ["native-preview/**", ".github/workflows/native-preview.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-preview
          cache-on-failure: true
      - run: cargo build --release --manifest-path native-preview/Cargo.toml
      - name: Open the GPUI window
        shell: pwsh
        run: |
          $marker = Join-Path $env:RUNNER_TEMP "novacord-native-render.txt"
          $panicLog = [IO.Path]::ChangeExtension($marker, "panic")
          $env:NOVACORD_NATIVE_SMOKE = $marker
          $process = Start-Process native-preview/target/release/novacord-native-preview.exe -PassThru
          try {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              if (Test-Path $panicLog) { throw (Get-Content $panicLog -Raw) }
              if ($process.HasExited) { throw "GPUI exited with code $($process.ExitCode)" }
              if (Test-Path $marker) {
                Get-Content $marker
                break
              }
            }
            if (!(Test-Path $marker)) { throw "GPUI did not render" }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id }
          }
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: NovaCord-Native-Preview-Windows
          path: |
            native-preview/target/release/novacord-native-preview.exe
            native-preview/Cargo.lock
          if-no-files-found: error
