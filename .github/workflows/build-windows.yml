name: Voxcord Web (Windows)

on:
  push:
    branches: [codex/voxcord-web]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voxcord-web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/checkout@v4
        with:
          repository: Vendicated/Vencord
          ref: 8d64c8be7e68616f8f116a6fff9480051aa2a0c5
          path: .vencord

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Build embedded Vencord
        shell: bash
        run: |
          pnpm --dir .vencord install --frozen-lockfile
          node scripts/prepare-vencord.mjs .vencord
          git -C .vencord add -f browser/Vencord.ts browser/NovaCordNative.ts src/userplugins/novacordMedia.ts
          git -C .vencord archive --format=zip --output=../Vencord-source.zip "$(git -C .vencord write-tree)"

      - name: Check shortcuts and audio mixer
        shell: bash
        run: |
          node --test tests/*.test.cjs
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo build --locked --manifest-path src-tauri/Cargo.toml --example soundboard_server
          node tests/browser.cjs
          node tests/native-input-browser.cjs
          node tests/remote-browser.cjs

      - name: Build the installer
        shell: bash
        run: npx --yes @tauri-apps/cli@2.12.5 build --ci -- --locked

      - name: Collect and install Voxcord Web
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer.' }
          Copy-Item $installers[0].FullName Voxcord-Web-Setup.exe
          Copy-Item src-tauri/target/release/voxcord-web.exe Voxcord-Web-portable.exe
          $installDir = Join-Path $env:RUNNER_TEMP 'voxcord-web-installed'
          $setup = Start-Process -FilePath './Voxcord-Web-Setup.exe' -ArgumentList "/S /D=$installDir" -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $installed = Join-Path $installDir 'voxcord-web.exe'
          if (-not (Test-Path -LiteralPath $installed)) { throw 'Installed executable is missing.' }
          "VOXCORD_INSTALLED=$installed" >> $env:GITHUB_ENV

      - name: Check standard Discord login and extension isolation
        shell: pwsh
        run: node tests/standard-startup.cjs "$env:VOXCORD_INSTALLED"

      - name: Open native windows and import real audio through IPC
        shell: pwsh
        run: |
          $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP 'voxcord-web-extensions-smoke'
          $process = Start-Process -FilePath $env:VOXCORD_INSTALLED -ArgumentList '--smoke-soundboard' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Native WebView2 smoke test timed out.'
          }
          if ($process.ExitCode -ne 0) { throw "Native WebView2 smoke test failed: $($process.ExitCode)" }
          Write-Output 'Native WebView2 windows and real WAV import through HTTP, binary IPC, decoder and IndexedDB succeeded.'

      - uses: actions/upload-artifact@v4
        with:
          name: Voxcord-Web-Windows-x64
          path: |
            Voxcord-Web-*.exe
            Vencord-source.zip
            README.md
            mod/VENCORD-LICENSE.txt
            mod/VENCORD-NOTICES.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Voxcord-Web-diagnostics
          path: |
            src-tauri/Cargo.lock
            tests-output/*.png
